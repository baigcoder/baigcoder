<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="1200" height="12" role="presentation" aria-hidden="true">
  <defs>
    <pattern id="hz" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="28" fill="#FCD107"/><rect x="14" width="14" height="28" fill="#0A0A0A"/></pattern>
    <style>@media (prefers-reduced-motion:reduce){.mv{display:none}}</style>
  </defs>
  <clipPath id="dc"><rect x="0" y="0" width="1200" height="12"/></clipPath>
  <g clip-path="url(#dc)"><rect x="-80" y="0" width="1360" height="12" fill="url(#hz)"/><rect class="mv" x="-80" y="0" width="1360" height="12" fill="url(#hz)"><animateTransform attributeName="transform" type="translate" from="0 0" to="39.6 0" dur="2.4s" repeatCount="indefinite"/></rect></g>
</svg>
