<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Muhammad Hassan Baig — Full-Stack AI Engineer</title>
  <desc id="d">Dark editorial banner with the name Muhammad Hassan Baig, the role Full-Stack AI Engineer and a one-line positioning statement. On the right, an abstract four-layer systems illustration: interface, API, data and inference, joined by thin signal lines. It is conceptual artwork, not a deployment diagram.</desc>
