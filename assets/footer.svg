<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">Let's build</title>
  <desc id="d">Closing banner on a yellow background: Let's build. Open to collaborate on AI products, SaaS, backend engineering and open source.</desc>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0A0A0A" stroke-width="1" opacity="0.12"/></pattern>
    <pattern id="hz" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="28" fill="#0A0A0A"/><rect x="14" width="14" height="28" fill="#FCD107"/></pattern>
    <style>
      .sans{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace}
      .pulse{animation:pu 2.8s ease-in-out infinite}
      @keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
      .fa{animation:fa 5.5s ease-in-out infinite}
      @keyframes fa{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      .flow{stroke-dasharray:3 6;animation:fl 1.6s linear infinite}
      @keyframes fl{to{stroke-dashoffset:-9}}
      .tk{opacity:0;animation:tk 12s linear infinite}
      .tk.a{opacity:1}
      @keyframes tk{0%{opacity:0}2%{opacity:1}23%{opacity:1}26%{opacity:0}100%{opacity:0}}
      .nudge{animation:nd 2.4s ease-in-out infinite}
      @keyframes nd{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
      .st{display:none}
      .kb{transform-box:fill-box;transform-origin:center;animation:kb 18s ease-in-out infinite alternate}
      @keyframes kb{from{transform:scale(1)}to{transform:scale(1.09)}}
      @media (prefers-reduced-motion:reduce){.pulse,.fa,.flow,.nudge,.kb{animation:none}.tk{animation:none;opacity:0}.tk.a{opacity:1}.mv{display:none}.st{display:inline}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="6" fill="#FCD107"/>
  <rect width="1200" height="300" rx="6" fill="url(#g)"/>
  <path d="M24 46V24H46M1154 24H1176V46M24 238V260H46M1154 260H1176V238" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-opacity="0.9"/>
  <text x="72" y="82" class="mono" font-size="16" font-weight="800" letter-spacing="3" fill="#0A0A0A">NEXT  /  LET'S TALK</text>
  <text x="66" y="210" class="sans" font-size="128" font-weight="900" letter-spacing="-3" textLength="783.2" lengthAdjust="spacingAndGlyphs" fill="#0A0A0A">LET'S BUILD.</text>
  <circle cx="86" cy="248" r="6" fill="#0A0A0A" class="pulse"/>
  <text x="104" y="254" class="mono" font-size="17" font-weight="800" letter-spacing="1.4" fill="#0A0A0A">OPEN TO COLLABORATE  ·  AI PRODUCTS  ·  SAAS  ·  BACKEND  ·  OPEN SOURCE</text>
  <circle cx="1030" cy="136" r="84" fill="#0A0A0A"/>
  <circle class="mv" cx="1030" cy="136" r="84" fill="none" stroke="#0A0A0A" stroke-width="3"><animate attributeName="r" values="84;118" dur="2.6s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".7;0" dur="2.6s" repeatCount="indefinite"/></circle>
  <g class="nudge"><path d="M1002 164L1058 108M1020 104H1060V144" fill="none" stroke="#FCD107" stroke-width="9" stroke-linecap="square"/></g>
  <clipPath id="hzc"><rect x="0" y="284" width="1200" height="16"/></clipPath>
  <g clip-path="url(#hzc)"><rect x="-80" y="284" width="1360" height="16" fill="url(#hz)"/><rect class="mv" x="-80" y="284" width="1360" height="16" fill="url(#hz)"><animateTransform attributeName="transform" type="translate" from="0 0" to="39.6 0" dur="1.8s" repeatCount="indefinite"/></rect></g>
</svg>
