      .tk.a{opacity:1}
      @keyframes tk{0%{opacity:0}2%{opacity:1}23%{opacity:1}26%{opacity:0}100%{opacity:0}}
      .nudge{animation:nd 2.4s ease-in-out infinite}
      @keyframes nd{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
      .st{display:none}
      .kb{transform-box:fill-box;transform-origin:center;animation:kb 18s ease-in-out infinite alternate}
      @keyframes kb{from{transform:scale(1)}to{transform:scale(1.09)}}
      @media (prefers-reduced-motion:reduce){.pulse,.fa,.flow,.nudge,.kb{animation:none}.tk{animation:none;opacity:0}.tk.a{opacity:1}.mv{display:none}.st{display:inline}}
    </style>
