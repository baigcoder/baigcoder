<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t d">
  <title id="t">What I build</title>
  <desc id="d">AI products: Media-authenticity scoring, resume analysis and WhatsApp intake agents. (TrueVibe · HIRE.OS · Wakeel). Backend systems: Queues, idempotent webhooks and row-level security. (Node · NestJS · Postgres · Redis). Real-time: Chat, calls, presence and live dashboards. (Socket.IO · WebRTC · Supabase). 3D web: Product experiences in the browser with three.js and GSAP. (Brewns · Grizzly).</desc>
