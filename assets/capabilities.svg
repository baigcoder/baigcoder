      .sans{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace}
      .pulse{animation:pu 3s ease-in-out infinite}
      @keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
      .wave{stroke-dasharray:100;animation:w 3.6s ease-in-out infinite}
      @keyframes w{0%{stroke-dashoffset:100}55%,100%{stroke-dashoffset:0}}
      @media (prefers-reduced-motion:reduce){.pulse,.wave{animation:none}}
    </style>
  </defs>
