<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" width="720" height="700" role="img" aria-labelledby="t d">
  <title id="t">TrueVibe architecture</title>
  <desc id="d">Three stacked layers connected by lines. A React 19 and Vite client. A Node.js and Express API using MongoDB, Redis with BullMQ and Socket.IO. A separate Python FastAPI AI service using PyTorch, transformers and OpenCV, plus an evidence-fusion step that exists only on the dev branch.</desc>
  <defs>
    <pattern id="g" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#2A2A2A" stroke-width="1" opacity="0.5"/></pattern>
    <style>
      .sans{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace}
      .pulse{animation:pu 2.8s ease-in-out infinite}
      @keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.pulse{animation:none}.mv{display:none}}
    </style>
  </defs>
  <rect width="720" height="700" rx="6" fill="#0A0A0A"/>
  <rect width="720" height="700" rx="6" fill="url(#g)"/>
  <rect x="1" y="1" width="718" height="698" rx="5" fill="none" stroke="#2A2A2A" stroke-width="2"/>
  <rect x="40" y="40" width="640" height="138" fill="#121212" stroke="#2A2A2A" stroke-width="2"/>
  <rect x="40" y="40" width="8" height="138" fill="#FCD107"/>
  <text x="72" y="72" class="mono" font-size="13" font-weight="800" letter-spacing="2" fill="#FCD107">01 · CLIENT</text>
  <text x="72" y="108" class="sans" font-size="25" font-weight="900" fill="#F5F3EA">React 19 + Vite</text>
  <text x="72" y="140" class="sans" font-size="17" font-weight="500" fill="#9A9A94">TypeScript · TanStack Router and Query</text>
  <text x="72" y="166" class="sans" font-size="17" font-weight="500" fill="#9A9A94">Tailwind CSS · Framer Motion · Socket.IO client</text>
  <rect x="40" y="222" width="640" height="160" fill="#121212" stroke="#2A2A2A" stroke-width="2"/>
  <rect x="40" y="222" width="8" height="160" fill="#FCD107"/>
  <text x="72" y="254" class="mono" font-size="13" font-weight="800" letter-spacing="2" fill="#FCD107">02 · API</text>
  <text x="72" y="290" class="sans" font-size="25" font-weight="900" fill="#F5F3EA">Node.js + Express</text>
  <text x="72" y="322" class="sans" font-size="17" font-weight="500" fill="#9A9A94">TypeScript · MongoDB (Mongoose) · Zod validation</text>
  <text x="72" y="348" class="sans" font-size="17" font-weight="500" fill="#9A9A94">Redis + BullMQ jobs · Socket.IO · rate limiting</text>
  <rect x="40" y="426" width="640" height="208" fill="#121212" stroke="#FCD107" stroke-width="2"/>
  <rect x="40" y="426" width="8" height="208" fill="#FCD107"/>
  <text x="72" y="458" class="mono" font-size="13" font-weight="800" letter-spacing="2" fill="#FCD107">03 · AI SERVICE</text>
  <text x="72" y="494" class="sans" font-size="25" font-weight="900" fill="#F5F3EA">Python + FastAPI</text>
  <text x="72" y="526" class="sans" font-size="17" font-weight="500" fill="#9A9A94">PyTorch + transformers (CPU) · OpenCV signals</text>
  <text x="72" y="552" class="sans" font-size="17" font-weight="500" fill="#9A9A94">Image and video analysis · PDF report</text>
  <rect x="72" y="572" width="584" height="38" fill="#0A0A0A" stroke="#FCD107" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="90" y="597" class="sans" font-size="16" font-weight="600" fill="#F5F3EA">Evidence fusion: a fake verdict needs corroboration</text>
  <text x="640" y="596" class="mono" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="end" fill="#FCD107">DEV BRANCH ONLY</text>
  <path d="M360 178V222" stroke="#FCD107" stroke-width="3"/><rect x="355" y="173" width="10" height="10" fill="#FCD107"/><rect x="355" y="217" width="10" height="10" fill="#FCD107"/>
  <path d="M360 382V426" stroke="#FCD107" stroke-width="3"/><rect x="355" y="377" width="10" height="10" fill="#FCD107"/><rect x="355" y="421" width="10" height="10" fill="#FCD107"/>
  <g class="mv"><rect x="-5" y="-5" width="10" height="10" fill="#00FF94"><animateMotion dur="2.4s" repeatCount="indefinite" path="M360 178V222"/></rect><rect x="-5" y="-5" width="10" height="10" fill="#00FF94"><animateMotion dur="2.9s" repeatCount="indefinite" path="M360 382V426"/></rect></g>
  <text x="40" y="664" class="mono" font-size="12" font-weight="500" letter-spacing="1" fill="#9A9A94">Untagged items exist on both main and dev. The default branch is dev.</text>
  <text x="40" y="684" class="mono" font-size="12" font-weight="500" letter-spacing="1" fill="#9A9A94">Lines show relationships, not protocols.</text>
</svg>
