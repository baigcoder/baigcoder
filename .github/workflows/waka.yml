name: WakaTime

on:

  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

jobs:

  update-readme:

    name: Update Readme

    runs-on: ubuntu-latest

    steps:

      - uses: athul/waka-readme@master

        with:

          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          SHOW_TITLE: true

          SHOW_TOTAL: true

          SHOW_MASKED_TIME: false

          TIME_RANGE: last_30_days

          LANG_COUNT: 10

          SHOW_PROFILE_VIEWS: false
